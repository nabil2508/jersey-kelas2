<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Nomor Jersey - Windows 98 Edition</title>
  
  <!-- Windows 98 CSS Framework -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #008080; /* Win98 Teal Background */
      margin: 0;
      padding: 12px;
      font-family: "MS Sans Serif", "Arial", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    .desktop {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #c0c0c0;
      padding: 4px 8px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 340px 1fr;
      }
    }

    .field-row-stacked {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      text-align: left;
    }

    .field-row-stacked label {
      margin-bottom: 4px;
      font-weight: bold;
    }

    .field-row-stacked input {
      width: 100%;
      padding: 4px 6px;
      font-family: monospace;
      font-size: 14px;
    }

    .table-container {
      background: #fff;
      box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
      max-height: 360px;
      overflow-y: auto;
    }

    table.sunken-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.sunken-table th {
      background: #c0c0c0;
      position: sticky;
      top: 0;
      border-bottom: 2px solid #808080;
      padding: 4px 8px;
      font-size: 12px;
      z-index: 2;
    }

    table.sunken-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 13px;
    }

    table.sunken-table tr:nth-child(even) {
      background-color: #f5f5f5;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-overlay.hidden {
      display: none !important;
    }

    .modal-window {
      width: 340px;
      max-width: 90vw;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    .modal-body-content {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
    }

    .modal-icon {
      font-size: 32px;
      flex-shrink: 0;
    }

    .modal-icon.error { color: #cc0000; }
    .modal-icon.info { color: #0000cc; }
    .modal-icon.warning { color: #ff9900; }

    .badge-count {
      background: #000080;
      color: #fff;
      padding: 2px 6px;
      font-weight: bold;
      font-size: 11px;
    }

    .status-bar {
      margin-top: 8px;
      display: flex;
      gap: 2px;
    }

    .status-bar p {
      margin: 0;
      padding: 2px 4px;
      font-size: 11px;
    }

    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      z-index: 1000;
    }

    .start-btn {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
    }

    .taskbar-time {
      border: 1px inset #fff;
      padding: 2px 8px;
      font-size: 11px;
      background: #c0c0c0;
    }

    .app-padding-bottom {
      padding-bottom: 40px;
    }
  </style>
</head>
<body class="app-padding-bottom">

<div class="desktop">

  <!-- Top System Banner -->
  <div class="window header-banner">
    <div style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-shirt" style="color: #000080; font-size: 18px;"></i>
      <strong style="font-size: 14px;">Jersey Kelas</strong>
    </div>
    <span class="badge-count" id="totalCountBadge">Terisi: 0 Jersey</span>
  </div>

  <div class="main-grid">

    <!-- LEFT COLUMN: Form Window -->
    <div class="window">
      <div class="title-bar">
        <div class="title-bar-text">Input_Jersey</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close" onclick="resetForm()"></button>
        </div>
      </div>

      <div class="window-body">
        <p style="margin-top: 0;">Masukkan data nama dan nomor jersey Anda:</p>

        <form id="jerseyForm" onsubmit="handleFormSubmit(event)">
          <div class="field-row-stacked">
            <label for="inputNama"><i class="fa-solid fa-user"></i> Nama Pemain / Jersey:</label>
            <input type="text" id="inputNama" placeholder="Contoh: RONALDO" required autocomplete="off" />
          </div>

          <div class="field-row-stacked">
            <label for="inputNomor"><i class="fa-solid fa-hashtag"></i> Nomor Punggung:</label>
            <input type="number" id="inputNomor" placeholder="Contoh: 7" min="1" max="99" required />
          </div>

          <div style="margin-top: 16px; display: flex; gap: 6px; justify-content: flex-end;">
            <button type="button" onclick="resetForm()">
              <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
            <button type="submit" id="btnSubmit" style="font-weight: bold;">
              <i class="fa-solid fa-floppy-disk"></i> Simpan Data
            </button>
          </div>
        </form>
      </div>

      <div class="status-bar">
        <p class="status-bar-field" style="flex: 1;" id="systemStatus">Siap menerima data.</p>
        <p class="status-bar-field"><i class="fa-solid fa-shield-halved"></i> Auto-Check ON</p>
      </div>
    </div>

    <!-- RIGHT COLUMN: Table Window -->
    <div class="window">
      <div class="title-bar">
        <div class="title-bar-text">Daftar_Jersey_Terisi</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="window-body">
        <div style="display: flex; gap: 8px; margin-bottom: 10px; align-items: center;">
          <div style="flex: 1;" class="field-row">
            <label for="searchQuery"><i class="fa-solid fa-magnifying-glass"></i> Cari:</label>
            <input type="text" id="searchQuery" style="width: 100%;" placeholder="Ketik nomor atau nama..." oninput="renderTable()" />
          </div>
        </div>

        <div class="table-container">
          <table class="sunken-table">
            <thead>
              <tr>
                <th style="width: 70px; text-align: center;">No.</th>
                <th>Nama Jersey</th>
                <th style="width: 140px;">Jam & Tanggal Daftar</th>
              </tr>
            </thead>
            <tbody id="jerseyTableBody">
              <!-- Data akan muncul di sini -->
            </tbody>
          </table>
        </div>

        <div style="margin-top: 8px; font-size: 11px; color: #444;">
          <span id="filteredInfo">Menampilkan 0 data</span>
        </div>
      </div>

      <div class="status-bar">
        <p class="status-bar-field" style="flex: 1;" id="explorerStatus">0 Objek terdaftar.</p>
      </div>
    </div>

  </div>
</div>

<!-- MODAL POPUP DIALOG -->
<div id="retroModal" class="modal-overlay hidden">
  <div class="window modal-window">
    <div class="title-bar">
      <div class="title-bar-text" id="modalTitle">Pesan Sistem</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeModal()"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="modal-body-content">
        <div id="modalIcon" class="modal-icon error">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div style="font-size: 12px; line-height: 1.4; flex: 1;" id="modalMessage">
          Pesan sistem.
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px;">
        <button onclick="closeModal()" style="min-width: 80px; font-weight: bold;">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- TASKBAR -->
<div class="taskbar">
  <button class="start-btn">
    <i class="fa-solid fa-window-restore" style="color: #000080;"></i>
    <span>Start</span>
  </button>
  <div style="flex: 1; margin: 0 8px; font-size: 11px; color: #555;">
    <span class="badge-count" style="background: #808080;">Jersey Kelas</span>
  </div>
  <div class="taskbar-time" id="clock">10:00 AM</div>
</div>

<script>
  // ==========================================
  // CONFIG_SUPABASE (MASUKKAN KUNCI DI SINI)
  // ==========================================
  const SUPABASE_URL = "https://vyitrykqfgdlwepdkbpa.supabase.co";  // Contoh: "https://xyzabc123.supabase.co"
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5aXRyeWtxZmdkbHdlcGRrYnBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjc5MDMsImV4cCI6MjEwNTc0MzkwM30.QADqSM1pjTpqGQnsx5uYIVIW-YPLsynZngu0fTbe-5U";  // Contoh: "eyJhbGciOiJIUzI1NiIsInR5cCI6..."
  // ==========================================

  const LOCAL_KEY = "WIN98_JERSEY_LOCAL_DATA";
  let jerseyList = [];

  window.addEventListener("DOMContentLoaded", () => {
    loadData();
    updateClock();
    setInterval(updateClock, 1000);
  });

  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    document.getElementById("clock").innerText = `${hours}:${minutes} ${ampm}`;
  }

  function getFormatWaktu() {
    const now = new Date();
    const tgl = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    return `${jam} (${tgl})`;
  }

  async function loadData() {
    updateStatus("Memuat data...");

    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/jersey?select=*`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          jerseyList = data.map(item => ({
            id: item.id,
            nama: item.nama,
            nomor: item.nomor,
            waktu: item.jam_daftar || "-"
          }));
          renderTable();
          updateStatus("Data terhubung ke Cloud Supabase.");
          return;
        }
      } catch (err) {
        console.error("Gagal terhubung ke Supabase:", err);
      }
    }

    // Backup ke LocalStorage jika Supabase belum dikonfigurasi
    const localData = localStorage.getItem(LOCAL_KEY);
    jerseyList = localData ? JSON.parse(localData) : [];
    renderTable();
    updateStatus(SUPABASE_URL ? "Gagal terhubung ke Cloud. Membuka Offline." : "Mode Offline (Belum terhubung Supabase).");
  }

  async function handleFormSubmit(e) {
    e.preventDefault();

    const namaInput = document.getElementById("inputNama").value.trim().toUpperCase();
    const nomorInput = parseInt(document.getElementById("inputNomor").value, 10);

    if (!namaInput || isNaN(nomorInput)) {
      showRetroModal("Input Tidak Valid", "Mohon isi nama dan nomor jersey!", "warning");
      return;
    }

    // CEK DUPLIKASI
    const existing = jerseyList.find(item => item.nomor === nomorInput);
    if (existing) {
      showRetroModal(
        "Nomor Sudah Terisi",
        `❌ <strong>Nomor ${nomorInput}</strong> sudah dipilih oleh <strong>"${existing.nama}"</strong>!<br><br>Silakan pilih nomor lain.`,
        "error"
      );
      return;
    }

    const waktuSekarang = getFormatWaktu();
    const btnSubmit = document.getElementById("btnSubmit");
    btnSubmit.disabled = true;

    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/jersey`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({
            nama: namaInput,
            nomor: nomorInput,
            jam_daftar: waktuSekarang
          })
        });

        if (!response.ok) {
          throw new Error("Gagal menyimpan ke Supabase");
        }
      } catch (err) {
        showRetroModal("Gagal Menyimpan", "Terjadi kesalahan saat menghubungkan ke database, atau nomor jersey sudah digunakan", "error");
        btnSubmit.disabled = false;
        return;
      }
    }

    // Simpan ke memori lokal & perbarui tampilan
    const newEntry = { id: Date.now(), nama: namaInput, nomor: nomorInput, waktu: waktuSekarang };
    jerseyList.push(newEntry);
    localStorage.setItem(LOCAL_KEY, JSON.stringify(jerseyList));

    renderTable();
    resetForm();
    btnSubmit.disabled = false;

    showRetroModal(
      "Berhasil Disimpan",
      `✅ Nomor jersey <strong>#${nomorInput}</strong> atas nama <strong>${namaInput}</strong> berhasil terdaftar!`,
      "info"
    );
  }

  function resetForm() {
    document.getElementById("jerseyForm").reset();
    document.getElementById("inputNama").focus();
  }

  function renderTable() {
    const tbody = document.getElementById("jerseyTableBody");
    const query = document.getElementById("searchQuery").value.toLowerCase().trim();
    tbody.innerHTML = "";

    const sortedList = [...jerseyList].sort((a, b) => a.nomor - b.nomor);
    const filtered = sortedList.filter(item => 
      item.nama.toLowerCase().includes(query) || item.nomor.toString().includes(query)
    );

    if (filtered.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="3" style="text-align: center; color: #777; padding: 16px;">
            ${query ? "Tidak ada nomor jersey yang cocok." : "Belum ada jersey yang terdaftar."}
          </td>
        </tr>
      `;
    } else {
      filtered.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="text-align: center; font-weight: bold; color: #000080;">#${item.nomor}</td>
          <td><strong>${escapeHtml(item.nama)}</strong></td>
          <td style="font-size: 11px; color: #555;">${item.waktu}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("totalCountBadge").innerText = `Terisi: ${jerseyList.length} Jersey`;
    document.getElementById("filteredInfo").innerText = `Menampilkan ${filtered.length} dari ${jerseyList.length} data`;
    document.getElementById("explorerStatus").innerText = `${jerseyList.length} objek terdaftar.`;
  }

  function showRetroModal(title, messageHtml, type = "info") {
    const modal = document.getElementById("retroModal");
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMessage").innerHTML = messageHtml;

    const iconEl = document.getElementById("modalIcon");
    iconEl.className = "modal-icon " + type;
    if (type === "error") {
      iconEl.innerHTML = '<i class="fa-solid fa-rectangle-xmark"></i>';
    } else if (type === "warning") {
      iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
    } else {
      iconEl.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
    }

    modal.classList.remove("hidden");
  }

  function closeModal() {
    document.getElementById("retroModal").classList.add("hidden");
  }

  function updateStatus(msg) {
    document.getElementById("systemStatus").innerText = msg;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
